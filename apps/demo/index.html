<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f5fb" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <meta name="description" content="Aries 工作区模板" />
    <title>Aries · 工作区</title>
    <!-- Applies the stored appearance before the first paint, so a dark or
         branded page never flashes light while the app loads. Keys match
         next-themes (aries-theme) and @marismoon/ui/lib/storage; main.tsx
         validates the palette again before React renders. -->
    <script>
      try {
        var root = document.documentElement
        var theme = localStorage.getItem("aries-theme") || "system"
        var dark =
          theme === "dark" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        root.classList.toggle("dark", dark)
        root.style.colorScheme = dark ? "dark" : "light"
        // Keep in sync with paletteLabels in @marismoon/ui/lib/storage.
        var palettes = ["telemedicine", "mental-health", "pet-adoption",
          "health-wellness", "amber-sand"]
        var palette = localStorage.getItem("aries-palette")
        root.dataset.palette =
          palettes.indexOf(palette) >= 0 ? palette : palettes[0]
        if (localStorage.getItem("aries-dark-style") === "clean")
          root.dataset.darkStyle = "clean"
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
